<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Looker Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2em;
        }
        
        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 54%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        
        /* Tablets y dispositivos medianos */
        @media (max-width: 1024px) {
            .container {
                padding: 25px;
                max-width: 95%;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .iframe-wrapper {
                padding-bottom: 60%;
            }
        }
        
        /* Móviles */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 10px;
                border-radius: 6px;
                max-height: 95vh;
                display: flex;
                flex-direction: column;
            }
            
            h1 {
                font-size: 1.3em;
                margin-bottom: 10px;
                flex-shrink: 0;
            }
            
            .iframe-wrapper {
                padding-bottom: 0;
                height: calc(95vh - 80px);
                flex-grow: 1;
                border-radius: 6px;
            }
            
            .iframe-wrapper iframe {
                position: relative;
            }
        }
        
        /* Móviles pequeños */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .container {
                padding: 8px;
                max-height: 98vh;
            }
            
            h1 {
                font-size: 1.2em;
                margin-bottom: 8px;
            }
            
            .iframe-wrapper {
                height: calc(98vh - 70px);
            }
        }
        
        /* Permitir scroll horizontal en móviles si es necesario */
        @media (max-width: 768px) {
            .iframe-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard de Análisis</h1>
        <div class="iframe-wrapper">
            <iframe 
                width="600" 
                height="443" 
                src="https://lookerstudio.google.com/embed/reporting/6881e20e-51e1-47e5-8409-27bb6e2f55a5/page/9IjaF" 
                frameborder="0" 
                style="border:0" 
                allowfullscreen 
                sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                loading="lazy"
                title="Dashboard de Looker Studio">
            </iframe>
        </div>
    </div>
</body>
</html>
