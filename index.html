<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Looker Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Pantalla de carga -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <img src="logo.png" alt="LBS+" class="loading-logo">
        </div>
    </div>

    <!-- Contenedor del iframe principal (Looker Studio) -->
    <div class="iframe-container">
        <!-- Iframe para orientación horizontal -->
        <iframe
            id="landscapeIframe"
            class="iframe-landscape"
            src="https://lookerstudio.google.com/embed/reporting/0d7bab96-b8a8-4390-9037-054ab4452114/page/p_so7gf6u0wd"
            loading="eager"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>

        <!-- Iframe para orientación vertical -->
        <iframe
            id="portraitIframe"
            class="iframe-portrait"
            src="https://lookerstudio.google.com/embed/reporting/33a2ab98-7514-4c54-80a0-ebdc2dc35bd5/page/W1IbF"
            loading="eager"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>

    <!-- Botón flotante para abrir tutorial -->
    <button class="tutorial-button" id="tutorialButton">
        <span onclick="openTutorial()">Ver Tutorial</span>
        <span class="close-icon" onclick="hideTutorialButton(event)" title="Cerrar">✕</span>
    </button>

    <!-- Modal del tutorial -->
    <div class="tutorial-modal" id="tutorialModal" onclick="closeTutorialOnOutside(event)">
        <div class="tutorial-content">
            <div class="tutorial-header">
                <h3>Tutorial: Cómo Filtrar Estadísticas de Roblox</h3>
                <button class="close-button" onclick="closeTutorial()">&times;</button>
            </div>
            <div class="tutorial-iframe-container">
                <!-- Tutorial para orientación horizontal -->
                <iframe
                    id="tutorialLandscape"
                    class="tutorial-iframe-landscape"
                    src="https://scribehow.com/embed/How_to_Filter_Roblox_Stats_by_Campus_and_Role__ehFQwp9_Qqe4nZbLjHrvbQ?skipIntro=true"
                    allow="fullscreen"
                    loading="lazy">
                </iframe>

                <!-- Tutorial para orientación vertical -->
                <iframe
                    id="tutorialPortrait"
                    class="tutorial-iframe-portrait"
                    src="https://scribehow.com/embed/How_to_Filter_Data_in_Looker_Studio__HOcymlP1TLOYMap_iZyXmw?skipIntro=true"
                    width="100%"
                    height="640"
                    allow="fullscreen"
                    style="aspect-ratio: 1 / 1; border: 0; min-height: 480px"
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
