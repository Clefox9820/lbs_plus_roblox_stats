<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Looker Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .iframe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            border: 0;
        }

        /* Mensaje de orientación */
        .orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 40px 20px;
        }

        .orientation-overlay.show {
            display: flex;
        }

        .rotate-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: rotate 2s infinite ease-in-out;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .orientation-overlay h2 {
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .orientation-overlay p {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 300px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }

        .btn {
            padding: 16px 32px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #4285f4;
            color: white;
        }

        .btn-primary:hover {
            background-color: #357ae8;
        }

        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Orientación vertical en móviles */
        @media (orientation: portrait) and (max-width: 768px) {
            .iframe-container {
                overflow-x: auto;
                overflow-y: hidden;
            }

            iframe {
                width: 600px;
                height: 100vh;
            }
        }

        /* Orientación horizontal */
        @media (orientation: landscape) {
            .iframe-container {
                overflow: hidden;
            }

            iframe {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Overlay de orientación -->
    <div class="orientation-overlay" id="orientationOverlay">
        <div class="rotate-icon">📱 ↻</div>
        <h2>Mejor experiencia en horizontal</h2>
        <p>Te recomendamos rotar tu dispositivo para ver el reporte completo sin necesidad de desplazarte</p>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="hideOverlay()">
                Ver de todas formas
            </button>
            <button class="btn btn-secondary" onclick="location.reload()">
                Entendido
            </button>
        </div>
    </div>

    <!-- Contenedor del iframe -->
    <div class="iframe-container">
        <iframe
            src="https://lookerstudio.google.com/embed/reporting/b0e23d97-56cc-42a0-93d5-3311070aa912/page/p_p94htbkxwd"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>

    <script>
        // Verificar orientación al cargar
        function checkOrientation() {
            const overlay = document.getElementById('orientationOverlay');
            const isPortrait = window.matchMedia("(orientation: portrait)").matches;
            const isMobile = window.innerWidth <= 768;
            
            // Mostrar overlay solo si es móvil en vertical y no se ha ocultado antes
            if (isPortrait && isMobile && !sessionStorage.getItem('orientationDismissed')) {
                overlay.classList.add('show');
            } else {
                overlay.classList.remove('show');
            }
        }

        function hideOverlay() {
            const overlay = document.getElementById('orientationOverlay');
            overlay.classList.remove('show');
            sessionStorage.setItem('orientationDismissed', 'true');
        }

        // Verificar al cargar la página
        checkOrientation();

        // Verificar cuando cambia la orientación
        window.addEventListener('orientationchange', function() {
            setTimeout(checkOrientation, 100);
        });

        // También verificar al redimensionar (para navegadores que no soportan orientationchange)
        window.addEventListener('resize', checkOrientation);
    </script>
</body>

</html>
