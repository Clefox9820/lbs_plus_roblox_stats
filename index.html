<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Looker Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .iframe-container {
            width: 100%;
            height: 100dvh; /* Dynamic viewport height */
            height: 100vh; /* Fallback para navegadores antiguos */
            overflow: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            min-height: 100vh;
            border: 0;
            display: block;
        }

        /* Botón flotante para tutorial */
        .tutorial-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .tutorial-button:hover {
            background-color: #357ae8;
            box-shadow: 0 6px 16px rgba(66, 133, 244, 0.5);
            transform: translateY(-2px);
        }

        .tutorial-button::before {
            content: "📖";
            font-size: 20px;
        }

        /* Modal del tutorial */
        .tutorial-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .tutorial-modal.show {
            display: flex;
        }

        .tutorial-content {
            background-color: white;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .tutorial-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tutorial-header h3 {
            margin: 0;
            font-size: 20px;
            color: #1a1a1a;
        }

        .close-button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .close-button:hover {
            background-color: #f5f5f5;
            color: #1a1a1a;
        }

        .tutorial-iframe-container {
            flex: 1;
            overflow: hidden;
        }

        .tutorial-iframe-container iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: 0;
        }

        /* Mensaje de orientación */
        .orientation-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh; /* Dynamic viewport height */
            height: 100vh; /* Fallback */
            background-color: #1a1a1a;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 40px 20px;
        }

        .orientation-overlay.show {
            display: flex;
        }

        .rotate-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: rotate 2s infinite ease-in-out;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .orientation-overlay h2 {
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .orientation-overlay p {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 300px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }

        .btn {
            padding: 16px 32px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #4285f4;
            color: white;
        }

        .btn-primary:hover {
            background-color: #357ae8;
        }

        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Responsivo para móviles */
        @media (max-width: 768px) {
            iframe {
                min-width: 100vw;
                min-height: calc(100dvh - env(safe-area-inset-bottom));
                min-height: calc(100vh - env(safe-area-inset-bottom));
            }

            .tutorial-button {
                bottom: 20px;
                right: 20px;
                padding: 14px 20px;
                font-size: 14px;
            }

            .tutorial-modal {
                padding: 10px;
            }

            .tutorial-content {
                max-height: 95vh;
                border-radius: 8px;
            }

            .tutorial-header {
                padding: 16px 20px;
            }

            .tutorial-header h3 {
                font-size: 18px;
            }

            .tutorial-iframe-container iframe {
                min-height: 500px;
            }
        }
    </style>
</head>

<body>
    <!-- Overlay de orientación -->
    <div class="orientation-overlay" id="orientationOverlay">
        <div class="rotate-icon">📱 ↻</div>
        <h2>Mejor experiencia en horizontal</h2>
        <p>Te recomendamos rotar tu dispositivo para ver el reporte completo sin necesidad de desplazarte</p>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="hideOverlay()">
                Ver de todas formas
            </button>
            <button class="btn btn-secondary" onclick="location.reload()">
                Entendido
            </button>
        </div>
    </div>

    <!-- Contenedor del iframe principal (Looker Studio) -->
    <div class="iframe-container">
        <iframe
            src="https://lookerstudio.google.com/embed/reporting/0d7bab96-b8a8-4390-9037-054ab4452114/page/p_so7gf6u0wd"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>

    <!-- Botón flotante para abrir tutorial -->
    <button class="tutorial-button" onclick="openTutorial()">
        Ver Tutorial
    </button>

    <!-- Modal del tutorial -->
    <div class="tutorial-modal" id="tutorialModal" onclick="closeTutorialOnOutside(event)">
        <div class="tutorial-content">
            <div class="tutorial-header">
                <h3>Tutorial: Cómo Filtrar Estadísticas de Roblox</h3>
                <button class="close-button" onclick="closeTutorial()">&times;</button>
            </div>
            <div class="tutorial-iframe-container">
                <iframe src="https://scribehow.com/embed/How_to_Filter_Roblox_Stats_by_Campus_and_Role__ehFQwp9_Qqe4nZbLjHrvbQ?skipIntro=true" allow="fullscreen"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Funciones para el modal del tutorial
        function openTutorial() {
            const modal = document.getElementById('tutorialModal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeTutorial() {
            const modal = document.getElementById('tutorialModal');
            modal.classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        function closeTutorialOnOutside(event) {
            if (event.target.id === 'tutorialModal') {
                closeTutorial();
            }
        }

        // Cerrar con tecla ESC
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeTutorial();
            }
        });

        // Ajustar altura del viewport dinámicamente
        function adjustViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        // Verificar orientación al cargar
        function checkOrientation() {
            const overlay = document.getElementById('orientationOverlay');
            const isPortrait = window.matchMedia("(orientation: portrait)").matches;
            const isMobile = window.innerWidth <= 768;

            // Mostrar overlay solo si es móvil en vertical y no se ha ocultado antes
            if (isPortrait && isMobile && !sessionStorage.getItem('orientationDismissed')) {
                overlay.classList.add('show');
            } else {
                overlay.classList.remove('show');
            }
        }

        function hideOverlay() {
            const overlay = document.getElementById('orientationOverlay');
            overlay.classList.remove('show');
            sessionStorage.setItem('orientationDismissed', 'true');
        }

        // Verificar al cargar la página
        adjustViewportHeight();
        checkOrientation();

        // Verificar cuando cambia la orientación
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                adjustViewportHeight();
                checkOrientation();
            }, 100);
        });

        // También verificar al redimensionar (para navegadores que no soportan orientationchange)
        window.addEventListener('resize', () => {
            adjustViewportHeight();
            checkOrientation();
        });

        // Ajustar cuando aparece/desaparece la barra del navegador
        window.addEventListener('scroll', adjustViewportHeight);
    </script>
</body>

</html>
