<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Looker Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .rotate-animation {
            animation: rotate 2s infinite ease-in-out;
        }

        /* Orientación vertical en móviles */
        @media (orientation: portrait) and (max-width: 768px) {
            .iframe-container {
                overflow-x: auto;
                overflow-y: auto;
            }

            .iframe-container iframe {
                width: 600px;
                height: 100vh;
            }
        }

        /* Orientación horizontal */
        @media (orientation: landscape) {
            .iframe-container {
                overflow: hidden;
            }

            .iframe-container iframe {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>

<body class="font-sans">
    <!-- Overlay de orientación -->
    <div id="orientationOverlay" 
         class="hidden fixed inset-0 w-screen h-screen bg-gray-900 text-white flex-col justify-center items-center z-[9999] text-center px-5 py-10">
        <div class="text-8xl mb-8 rotate-animation">📱 ↻</div>
        <h2 class="text-2xl mb-4 font-semibold">Mejor experiencia en horizontal</h2>
        <p class="text-base opacity-80 mb-10 leading-relaxed max-w-xs">
            Te recomendamos rotar tu dispositivo para ver el reporte completo sin necesidad de desplazarte
        </p>
        <div class="flex flex-col gap-4 w-full max-w-xs">
            <button onclick="hideOverlay()" 
                    class="px-8 py-4 text-base border-0 rounded-lg cursor-pointer font-medium transition-all duration-300 bg-blue-500 text-white hover:bg-blue-600">
                Ver de todas formas
            </button>
            <button onclick="location.reload()" 
                    class="px-8 py-4 text-base rounded-lg cursor-pointer font-medium transition-all duration-300 bg-transparent text-white border-2 border-white/30 hover:border-white/60 hover:bg-white/5">
                Entendido
            </button>
        </div>
    </div>

    <!-- Contenedor del iframe -->
    <div class="iframe-container w-screen h-screen relative">
        <iframe
            src="https://lookerstudio.google.com/embed/reporting/b0e23d97-56cc-42a0-93d5-3311070aa912/page/p_p94htbkxwd"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
            class="absolute top-0 left-0 border-0">
        </iframe>
    </div>

    <script>
        function checkOrientation() {
            const overlay = document.getElementById('orientationOverlay');
            const isPortrait = window.matchMedia("(orientation: portrait)").matches;
            const isMobile = window.innerWidth <= 768;
            
            if (isPortrait && isMobile && !sessionStorage.getItem('orientationDismissed')) {
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            } else {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }
        }

        function hideOverlay() {
            const overlay = document.getElementById('orientationOverlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            sessionStorage.setItem('orientationDismissed', 'true');
        }

        checkOrientation();

        window.addEventListener('orientationchange', function() {
            setTimeout(checkOrientation, 100);
        });

        window.addEventListener('resize', checkOrientation);
    </script>
</body>

</html>
