<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Looker Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        .iframe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            border: 0;
            width: 100%;
            height: 100%;
        }

        /* Mensaje para rotar en orientación vertical */
        .rotate-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }

        .rotate-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: rotate 2s infinite;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .rotate-message h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .rotate-message p {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Mostrar mensaje solo en orientación vertical en móviles */
        @media (orientation: portrait) and (max-width: 768px) {
            .rotate-message {
                display: flex;
            }

            .iframe-container {
                display: none;
            }
        }

        /* En landscape todo funciona normal */
        @media (orientation: landscape) {
            .iframe-container {
                overflow: hidden;
            }
        }
    </style>
</head>

<body>
    <!-- Mensaje para rotar el dispositivo -->
    <div class="rotate-message">
        <div class="rotate-icon">📱 ↻</div>
        <h2>Rota tu dispositivo</h2>
        <p>Por favor, gira tu dispositivo a modo horizontal para una mejor experiencia</p>
    </div>

    <!-- Contenedor del iframe -->
    <div class="iframe-container">
        <iframe
            src="https://lookerstudio.google.com/embed/reporting/b0e23d97-56cc-42a0-93d5-3311070aa912/page/p_p94htbkxwd"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>
</body>

</html>
