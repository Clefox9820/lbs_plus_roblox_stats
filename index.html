<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        frame-src https://lookerstudio.google.com https://scribehow.com;
        img-src 'self' data: https:;
        connect-src 'self';
        font-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
    ">

    <!-- Additional Security Headers -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">

    <title>Reporte Looker Studio</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Load configuration before scripts -->
    <script src="config.js"></script>
</head>

<body>
    <!-- Pantalla de carga -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <img src="logo.png" alt="LBS+" class="loading-logo">
        </div>
    </div>

    <!-- Contenedor del iframe principal (Looker Studio) -->
    <div class="iframe-container">
        <!-- Iframe para orientación horizontal -->
        <!-- URL is loaded dynamically from config.js -->
        <iframe
            id="landscapeIframe"
            class="iframe-landscape"
            src=""
            loading="eager"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>

        <!-- Iframe para orientación vertical -->
        <!-- URL is loaded dynamically from config.js -->
        <iframe
            id="portraitIframe"
            class="iframe-portrait"
            src=""
            loading="eager"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>

    <!-- Botón flotante para abrir tutorial -->
    <button class="tutorial-button" id="tutorialButton">
        <span id="openTutorialBtn">Ver Tutorial</span>
        <span class="close-icon" id="closeTutorialBtn" title="Cerrar">✕</span>
    </button>

    <!-- Modal del tutorial -->
    <div class="tutorial-modal" id="tutorialModal">
        <div class="tutorial-content">
            <div class="tutorial-header">
                <h3>Tutorial: Cómo Filtrar Estadísticas de Roblox</h3>
                <button class="close-button" id="closeModalBtn">&times;</button>
            </div>
            <div class="tutorial-iframe-container">
                <!-- Tutorial para orientación horizontal -->
                <!-- URL is loaded dynamically from config.js -->
                <iframe
                    id="tutorialLandscape"
                    class="tutorial-iframe-landscape"
                    src=""
                    allow="fullscreen"
                    loading="lazy">
                </iframe>

                <!-- Tutorial para orientación vertical -->
                <!-- URL is loaded dynamically from config.js -->
                <iframe
                    id="tutorialPortrait"
                    class="tutorial-iframe-portrait"
                    src=""
                    width="100%"
                    height="640"
                    allow="fullscreen"
                    style="aspect-ratio: 1 / 1; border: 0; min-height: 480px"
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
