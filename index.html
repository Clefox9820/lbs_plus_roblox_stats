<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Looker Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Overlay de orientación -->
    <div class="orientation-overlay" id="orientationOverlay">
        <div class="rotate-icon">📱 ↻</div>
        <h2>Mejor experiencia en horizontal</h2>
        <p>Te recomendamos rotar tu dispositivo para ver el reporte completo sin necesidad de desplazarte</p>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="hideOverlay()">
                Ver de todas formas
            </button>
            <button class="btn btn-secondary" onclick="location.reload()">
                Entendido
            </button>
        </div>
    </div>

    <!-- Contenedor del iframe principal (Looker Studio) -->
    <div class="iframe-container">
        <!-- Iframe para orientación horizontal -->
        <iframe
            id="landscapeIframe"
            class="iframe-landscape"
            src="https://lookerstudio.google.com/embed/reporting/0d7bab96-b8a8-4390-9037-054ab4452114/page/p_so7gf6u0wd"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>

        <!-- Iframe para orientación vertical -->
        <iframe
            id="portraitIframe"
            class="iframe-portrait"
            src="https://lookerstudio.google.com/embed/reporting/33a2ab98-7514-4c54-80a0-ebdc2dc35bd5/page/W1IbF"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
    </div>

    <!-- Botón flotante para abrir tutorial -->
    <button class="tutorial-button" onclick="openTutorial()">
        Ver Tutorial
    </button>

    <!-- Modal del tutorial -->
    <div class="tutorial-modal" id="tutorialModal" onclick="closeTutorialOnOutside(event)">
        <div class="tutorial-content">
            <div class="tutorial-header">
                <h3>Tutorial: Cómo Filtrar Estadísticas de Roblox</h3>
                <button class="close-button" onclick="closeTutorial()">&times;</button>
            </div>
            <div class="tutorial-iframe-container">
                <iframe src="https://scribehow.com/embed/How_to_Filter_Roblox_Stats_by_Campus_and_Role__ehFQwp9_Qqe4nZbLjHrvbQ?skipIntro=true" allow="fullscreen"></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
